[workspace]
resolver = "3"
members = ["crates/kerr", "crates/shaders", "crates/render", "crates/render-hq", "crates/engine", "crates/desktop"]
default-members = ["crates/kerr", "crates/shaders", "crates/render", "crates/render-hq", "crates/desktop"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev.package.kerr]
opt-level = 2
