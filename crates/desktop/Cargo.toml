[package]
name = "desktop"
description = "Native desktop flight through the Kerr nucleus: the physics and renderer without the portfolio."
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "kerr-nucleus"
path = "src/main.rs"

[dependencies]
kerr = { path = "../kerr" }
render = { path = "../render" }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "metal", "dx12"] }
winit = "0.30"
pollster = "1"
png = "0.18"
