[package]
name = "render"
description = "The Kerr nucleus renderer: wgpu passes shared by the browser engine and the desktop app."
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
kerr = { path = "../kerr" }
shaders = { path = "../shaders" }
bytemuck = { version = "1.25", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["webgpu", "wgsl"] }
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "console"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan", "metal", "dx12"] }
