[package]
name = "engine"
description = "WebAssembly + WebGPU front end: runs the Kerr world and renders it from the pilot's past light cone."
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kerr = { path = "../kerr" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
render = { path = "../render" }
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "console"] }
console_error_panic_hook = "0.1"
wgpu = { version = "30", default-features = false, features = ["webgpu", "wgsl"] }
